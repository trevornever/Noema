name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: noema
          POSTGRES_PASSWORD: noema-ci
          POSTGRES_DB: noema
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U noema -d noema"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_POSTGRES_DSN: postgresql://noema:noema-ci@localhost:5432/noema
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Compile Python
        run: python -m compileall -q noema tests
      - name: Run test suite (SQLite + PostgreSQL)
        run: pytest -q
      - name: Check maintenance scripts
        run: sh -n scripts/backup.sh scripts/restore.sh
      - name: Build container
        run: docker build -t noema:ci .
