name: noema

services:
  noema:
    build:
      context: .
      dockerfile: Dockerfile
    image: noema:local
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NOEMA_DB_PATH: /app/data/noema.db
      NOEMA_CORS_ORIGINS: ${NOEMA_CORS_ORIGINS:-http://localhost:8000}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b}
      LLM_API_KEY: ${LLM_API_KEY:-ollama}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - noema_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  ollama:
    image: ollama/ollama:latest
    profiles: ["local-ai"]
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    # Deliberately not published to the host; Noema reaches it over the Compose network.

volumes:
  noema_data:
  ollama_models:
